<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPT Continuum</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --paper: #f4eee4;
        --panel: #fffdf8;
        --ink: #3e332b;
        --muted: #7f6d5d;
        --line: #e4d8c9;
        --accent: #b95e49;
        --accent-dark: #944735;
        --sage: #4e6b68;
        --danger: #a84a3c;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 14px;
        background:
          radial-gradient(circle at 12% 10%, rgba(201, 111, 82, .14), transparent 34%),
          radial-gradient(circle at 90% 80%, rgba(78, 107, 104, .10), transparent 30%),
          var(--paper);
        color: var(--ink);
      }
      main { max-width: 520px; margin: 0 auto; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 22px 60px rgba(98, 72, 50, .12); }
      .masthead { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
      .mark { display: grid; flex: 0 0 42px; place-items: center; width: 42px; height: 42px; border-radius: 50%; color: #fffaf1; background: var(--accent); font-family: Georgia, "Songti SC", serif; font-size: 26px; line-height: 1; transform: rotate(-8deg); }
      .eyebrow { margin: 2px 0 5px; color: var(--sage); font-size: 11px; font-weight: 750; letter-spacing: .08em; }
      h1 { margin: 0; color: var(--ink); font-family: Georgia, "Songti SC", serif; font-size: 27px; font-weight: 650; letter-spacing: -.035em; }
      .intro { max-width: 42em; margin: 17px 0 21px; color: var(--muted); font-size: 14px; line-height: 1.65; }
      label { display: block; margin: 15px 0 7px; color: var(--ink); font-size: 13px; font-weight: 700; }
      textarea, input, select { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #fffaf2; color: var(--ink); font: inherit; padding: 11px 12px; outline: none; }
      textarea { min-height: 82px; resize: vertical; line-height: 1.5; }
      textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(185, 94, 73, .16); }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
      .actions { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 8px; margin-top: 19px; }
      button { min-height: 43px; border: 0; border-radius: 12px; padding: 11px 12px; color: #fffaf2; background: var(--accent); font: inherit; font-weight: 750; cursor: pointer; transition: transform .18s ease, background .18s ease; }
      button:hover { background: var(--accent-dark); transform: translateY(-1px); }
      button.secondary { color: var(--ink); background: #fffaf2; border: 1px solid var(--line); }
      button.secondary:hover { background: #f6ede1; }
      button:focus-visible { outline: 3px solid rgba(78, 107, 104, .28); outline-offset: 2px; }
      button:disabled { cursor: not-allowed; opacity: .5; transform: none; }
      .status { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 17px; padding: 12px 13px; border: 1px solid rgba(78, 107, 104, .18); border-radius: 12px; background: rgba(78, 107, 104, .09); color: var(--sage); font-size: 13px; }
      .status::before { width: 8px; height: 8px; margin-right: auto; border-radius: 50%; background: currentColor; content: ""; opacity: .7; }
      .status strong { color: var(--ink); font-variant-numeric: tabular-nums; }
      .error { color: var(--danger); }
      .footer { margin: 16px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
      @media (max-width: 420px) { main { padding: 20px; } .actions { grid-template-columns: 1fr 1fr; } .actions #start { grid-column: 1 / -1; } }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } button:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="masthead">
        <span class="mark" aria-hidden="true">∞</span>
        <div>
          <p class="eyebrow">研究 × 科技 · ChatGPT plugin</p>
          <h1>让对话继续向前</h1>
        </div>
      </div>
      <p class="intro">当 GPT 说 “at capacity” 或中途停住时，有些工作最难的不是开始，而是重新回到它身边。写下你想说的话，让 GPT Continuum 在你设定的节奏里，把下一句送回当前对话。</p>

      <label for="language">语言模板</label>
      <select id="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="custom">自定义</option>
      </select>

      <label for="message">发送内容</label>
      <textarea id="message">继续，如果已完成请你忽略本条信息</textarea>
      <p class="hint">保留“如果已完成请你忽略”这句，可以让任务完成后安静地停下来。</p>

      <div class="grid">
        <div>
          <label for="interval">间隔（秒）</label>
          <input id="interval" type="number" min="5" max="86400" value="60" />
        </div>
        <div>
          <label for="maxAttempts">最多次数</label>
          <input id="maxAttempts" type="number" min="0" max="9999" value="0" />
          <p class="hint">0 = 持续运行，随时可以停</p>
        </div>
      </div>

      <div class="actions">
        <button id="start">开始自动继续</button>
        <button id="stop" class="secondary" disabled>停止</button>
        <button id="once" class="secondary">只发送一次</button>
      </div>

      <div class="status" aria-live="polite">
        <span id="statusText">准备就绪</span>
        <strong id="count">0 次</strong>
      </div>
      <p class="footer">计时器运行在插件面板中。关闭面板或点击停止会结束计时；插件不读取对话内容，也不保存账号信息。</p>
    </main>

    <script>
      const messages = {
        zh: "继续，如果已完成请你忽略本条信息",
        en: "Continue. If the task is already complete, please ignore this message."
      };
      const languageEl = document.querySelector("#language");
      const messageEl = document.querySelector("#message");
      const intervalEl = document.querySelector("#interval");
      const maxAttemptsEl = document.querySelector("#maxAttempts");
      const startEl = document.querySelector("#start");
      const stopEl = document.querySelector("#stop");
      const onceEl = document.querySelector("#once");
      const statusEl = document.querySelector("#statusText");
      const countEl = document.querySelector("#count");

      let running = false;
      let sending = false;
      let count = 0;
      let timer = null;
      let countdownTimer = null;
      let bridgeReady = null;
      let requestId = 0;
      const pending = new Map();
      const hasHostBridge = () => typeof window.openai?.sendFollowUpMessage === "function" || window.parent !== window;

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", isError);
      }

      function updateCount() {
        countEl.textContent = `${count} 次`;
      }

      function notify(method, params) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      function request(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++requestId;
          const timeout = setTimeout(() => {
            pending.delete(id);
            reject(new Error("ChatGPT plugin bridge is unavailable"));
          }, 3000);
          pending.set(id, { resolve, reject, timeout });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || !event.data || event.data.jsonrpc !== "2.0") return;
        const message = event.data;
        if (typeof message.id !== "number") return;
        const pendingRequest = pending.get(message.id);
        if (!pendingRequest) return;
        pending.delete(message.id);
        clearTimeout(pendingRequest.timeout);
        if (message.error) pendingRequest.reject(message.error);
        else pendingRequest.resolve(message.result);
      }, { passive: true });

      bridgeReady = (async () => {
        if (typeof window.openai?.sendFollowUpMessage === "function") return;
        await request("ui/initialize", {
          appInfo: { name: "gpt-continuum", version: "0.1.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26"
        });
        notify("ui/notifications/initialized", {});
      })().catch((error) => {
        console.error("MCP Apps bridge initialization failed", error);
        throw error;
      });

      async function sendFollowUp(text) {
        await bridgeReady;
        if (typeof window.openai?.sendFollowUpMessage === "function") {
          return window.openai.sendFollowUpMessage({ prompt: text, scrollToBottom: false });
        }
        notify("ui/message", {
          role: "user",
          content: [{ type: "text", text }],
          _meta: { "openai/message": { target: "active", send: true } }
        });
      }

      async function sendOnce() {
        if (sending) return false;
        if (!hasHostBridge()) {
          setStatus("预览模式：请从 ChatGPT Plugins 中打开 GPT Continuum 后再发送", true);
          return false;
        }
        const text = messageEl.value.trim();
        if (!text) { setStatus("请先填写发送内容", true); return false; }
        sending = true;
        onceEl.disabled = true;
        try {
          await sendFollowUp(text);
          count += 1;
          updateCount();
          setStatus(running ? "已发送，等待下一次" : "已发送一次");
          if (running && Number(maxAttemptsEl.value) > 0 && count >= Number(maxAttemptsEl.value)) stop();
          return true;
        } catch (error) {
          console.error("Follow-up message failed", error);
          setStatus("发送失败，请检查当前 ChatGPT 版本或插件权限", true);
          if (running) stop();
          return false;
        } finally {
          sending = false;
          onceEl.disabled = false;
        }
      }

      function clearTimers() {
        if (timer) clearTimeout(timer);
        if (countdownTimer) clearInterval(countdownTimer);
        timer = null;
        countdownTimer = null;
      }

      function scheduleNext() {
        clearTimers();
        if (!running) return;
        const seconds = Math.max(5, Math.min(86400, Number(intervalEl.value) || 60));
        let remaining = seconds;
        setStatus(`下一次发送还有 ${remaining} 秒`);
        countdownTimer = setInterval(() => {
          remaining -= 1;
          if (remaining > 0) setStatus(`下一次发送还有 ${remaining} 秒`);
        }, 1000);
        timer = setTimeout(async () => {
          clearTimers();
          await sendOnce();
          scheduleNext();
        }, seconds * 1000);
      }

      async function start() {
        if (running) return;
        const interval = Number(intervalEl.value);
        const maxAttempts = Number(maxAttemptsEl.value);
        if (!Number.isFinite(interval) || interval < 5) { setStatus("间隔至少为 5 秒", true); return; }
        if (!Number.isInteger(maxAttempts) || maxAttempts < 0) { setStatus("最多次数必须是 0 或正整数", true); return; }
        running = true;
        count = 0;
        updateCount();
        startEl.disabled = true;
        stopEl.disabled = false;
        intervalEl.disabled = true;
        maxAttemptsEl.disabled = true;
        languageEl.disabled = true;
        messageEl.disabled = true;
        try { await window.openai?.requestDisplayMode?.({ mode: "pip" }); } catch (_) { /* optional host feature */ }
        await sendOnce();
        if (running) scheduleNext();
      }

      function stop() {
        running = false;
        clearTimers();
        startEl.disabled = false;
        stopEl.disabled = true;
        intervalEl.disabled = false;
        maxAttemptsEl.disabled = false;
        languageEl.disabled = false;
        messageEl.disabled = false;
        setStatus(count ? "已停止" : "准备就绪");
      }

      languageEl.addEventListener("change", () => {
        if (messages[languageEl.value]) messageEl.value = messages[languageEl.value];
      });
      if (!hasHostBridge()) {
        setStatus("预览模式：请从 ChatGPT Plugins 中打开 GPT Continuum 后再发送", true);
        startEl.disabled = true;
        onceEl.disabled = true;
      }
      startEl.addEventListener("click", start);
      stopEl.addEventListener("click", stop);
      onceEl.addEventListener("click", sendOnce);
    </script>
  </body>
</html>
